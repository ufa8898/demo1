<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangout QR Order</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d0d0c;color:#fff}button,input,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:18px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:#0d0d0ceF;padding:10px 0;z-index:10}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:#ffc857;color:#111;display:grid;place-items:center;font-weight:900;font-size:20px}.muted{color:#aaa}.hero{background:linear-gradient(135deg,#292313,#171715);border:1px solid #3a3320;border-radius:24px;padding:26px;margin:12px 0 18px;display:flex;justify-content:space-between;gap:18px;align-items:center}.hero h1{font-size:36px;margin:0 0 8px}.badge{background:#10100f;border:1px solid #4a4024;border-radius:16px;padding:12px 18px;text-align:center}.badge b{font-size:30px;color:#ffc857}.layout{display:grid;grid-template-columns:1fr 320px;gap:18px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.tabs button,.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.tabs button{white-space:nowrap;background:#20201d;color:#eee}.tabs button.on,.btn{background:#ffc857;color:#17120a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item,.card{background:#181816;border:1px solid #2b2a26;border-radius:18px;padding:14px}.item .emoji{font-size:42px;background:#23221f;border-radius:14px;height:92px;display:grid;place-items:center}.item h3{margin:10px 0 4px}.price{color:#ffc857;font-weight:900}.item .btn{width:100%;margin-top:10px}.cart{position:sticky;top:78px;height:max-content}.cartline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #2c2b27}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;padding:12px 0}textarea,input{width:100%;background:#10100f;color:#fff;border:1px solid #393730;border-radius:11px;padding:10px;margin:7px 0}.card{margin-top:16px}.hidden{display:none}.staff{display:grid;grid-template-columns:2fr 1fr;gap:14px}.order{padding:12px;border:1px solid #30302b;border-radius:14px;margin:10px 0;background:#11110f}.status{color:#8be7a2}.qr{background:#fff;border-radius:14px;padding:12px;margin-top:12px;text-align:center}@media(max-width:900px){.layout,.staff{grid-template-columns:1fr}.cart{position:static}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:29px}.wrap{padding:12px}}</style><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script></head><body><div class="wrap">
<div class="nav"><div class="brand"><div class="logo">H</div><div><b>HANGOUT</b><div class="muted" style="font-size:12px">QR Order</div></div></div><button class="btn" onclick="toggleStaff()">โหมดพนักงาน</button></div>
<section id="customer"><div class="hero"><div><div class="muted">WELCOME TO HANGOUT</div><h1>สั่งอาหารง่าย ๆ จากโต๊ะคุณ</h1><div class="muted">เลือกเมนู เพิ่มลงตะกร้า แล้วส่งออเดอร์ได้ทันที</div></div><div class="badge">โต๊ะ<br><b id="tableNo"></b></div></div>
<div class="layout"><main><div class="tabs" id="tabs"></div><div class="grid" id="menu"></div><div class="card"><h2>ออเดอร์โต๊ะนี้</h2><div id="history"></div></div></main>
<aside class="card cart"><h2>ตะกร้า</h2><div id="cart"></div><textarea id="note" placeholder="หมายเหตุ เช่น ไม่เผ็ด / ไม่ใส่น้ำแข็ง"></textarea><button class="btn" style="width:100%" onclick="placeOrder()">ยืนยันคำสั่งซื้อ</button></aside></div></section>
<section id="staff" class="hidden"><div class="hero"><div><div class="muted">STAFF DASHBOARD</div><h1>จัดการออเดอร์</h1></div><button class="btn" onclick="toggleStaff()">กลับหน้าลูกค้า</button></div><div class="staff"><div class="card"><h2>ออเดอร์ทั้งหมด</h2><div id="allOrders"></div></div><div class="card"><h2>สร้าง QR โต๊ะ</h2><input id="qrTable" type="number" min="1" value="1"><button class="btn" style="width:100%" onclick="makeQR()">สร้าง QR Code</button><div class="qr"><canvas id="qr"></canvas></div><div id="qrUrl" class="muted"></div><button id="downloadQrBtn" class="btn" style="width:100%;margin-top:10px;display:none" onclick="downloadQR()">บันทึก QR เป็นรูป</button></div></div></section>
</div><script>
const data=[
["อาหารจานเดียว","ข้าวกะเพราหมูกรอบ",99,"🍛"],["อาหารจานเดียว","ข้าวกะเพราเนื้อ",109,"🥩"],["อาหารจานเดียว","ข้าวผัดกุ้ง",89,"🍤"],["อาหารจานเดียว","ข้าวผัดทะเล",109,"🦐"],["อาหารจานเดียว","ข้าวหมูกระเทียม",89,"🍚"],["อาหารจานเดียว","ข้าวไก่ทอดซอสเกาหลี",109,"🍗"],
["ของทานเล่น","เฟรนช์ฟรายส์",79,"🍟"],["ของทานเล่น","นักเก็ตไก่",89,"🍗"],["ของทานเล่น","ปีกไก่ทอด",119,"🍗"],["ของทานเล่น","ชีสบอล",99,"🧀"],["ของทานเล่น","เอ็นไก่ทอด",109,"🍖"],["ของทานเล่น","ไส้กรอกทอด",89,"🌭"],
["กับแกล้ม","คอหมูย่าง",139,"🥩"],["กับแกล้ม","หมูมะนาว",129,"🍋"],["กับแกล้ม","เนื้อแดดเดียว",159,"🥩"],["กับแกล้ม","กุ้งแช่น้ำปลา",169,"🦐"],["กับแกล้ม","ลาบหมู",119,"🥗"],["กับแกล้ม","ปลาหมึกย่าง",169,"🦑"],
["ต้ม/ยำ","ต้มแซ่บกระดูกอ่อน",159,"🍲"],["ต้ม/ยำ","ต้มยำทะเล",189,"🍲"],["ต้ม/ยำ","ยำวุ้นเส้นทะเล",139,"🥗"],["ต้ม/ยำ","ยำหมูยอ",119,"🥗"],["ต้ม/ยำ","ยำแซลมอน",199,"🐟"],["ต้ม/ยำ","ยำมาม่าทะเล",139,"🍜"],
["เครื่องดื่ม","โค้ก",30,"🥤"],["เครื่องดื่ม","สไปรท์",30,"🥤"],["เครื่องดื่ม","น้ำเปล่า",20,"💧"],["เครื่องดื่ม","โซดา",25,"🫧"],["เครื่องดื่ม","น้ำส้ม",45,"🍊"],["เครื่องดื่ม","ชาเขียว",55,"🍵"],
["เบียร์","Singha",95,"🍺"],["เบียร์","Leo",85,"🍺"],["เบียร์","Chang",85,"🍺"],["เบียร์","Heineken",110,"🍺"],
["สุรา","Regency",520,"🥃"],["สุรา","Blend 285",490,"🥃"],["สุรา","Hong Thong",420,"🥃"],["สุรา","SangSom",450,"🥃"],
["มิกเซอร์","น้ำแข็ง",40,"🧊"],["มิกเซอร์","โทนิค",35,"🥛"],["มิกเซอร์","น้ำมะนาว",40,"🍋"],["มิกเซอร์","น้ำแดง",35,"🥤"],
["ของหวาน","ไอศกรีมวานิลลา",69,"🍨"],["ของหวาน","บราวนี่ไอศกรีม",99,"🍫"],["ของหวาน","ฮันนี่โทสต์",129,"🍞"],["ของหวาน","เฉาก๊วยนมสด",69,"🥛"]
].map((x,i)=>({id:i+1,cat:x[0],name:x[1],price:x[2],emoji:x[3]}));
const q=new URLSearchParams(location.search),table=q.get("table")||"1";let cat=data[0].cat,cart=[];tableNo.textContent=table;
function cats(){return [...new Set(data.map(x=>x.cat))]}function renderTabs(){tabs.innerHTML=cats().map(c=>`<button class="${c===cat?"on":""}" onclick="cat='${c}';renderMenu();renderTabs()">${c}</button>`).join("")}
function renderMenu(){menu.innerHTML=data.filter(x=>x.cat===cat).map(x=>`<div class="item"><div class="emoji">${x.emoji}</div><h3>${x.name}</h3><div class="price">฿${x.price}</div><button class="btn" onclick="add(${x.id})">+ เพิ่มลงตะกร้า</button></div>`).join("")}
function add(id){let x=data.find(a=>a.id===id),y=cart.find(a=>a.id===id);y?y.qty++:cart.push({...x,qty:1});renderCart()}
function renderCart(){cart.innerHTML=cart.length?cart.map(x=>`<div class="cartline"><span>${x.name} × ${x.qty}</span><span>฿${x.price*x.qty}</span></div>`).join("")+`<div class="total"><span>รวม</span><span>฿${cart.reduce((s,x)=>s+x.price*x.qty,0)}</span></div>`:"<div class='muted'>ยังไม่มีสินค้า</div>"}
function orders(){return JSON.parse(localStorage.getItem("orders")||"[]")}function saveOrders(x){localStorage.setItem("orders",JSON.stringify(x))}
function placeOrder(){if(!cart.length)return alert("กรุณาเลือกสินค้า");let o=orders();o.unshift({id:Date.now(),table,items:cart,total:cart.reduce((s,x)=>s+x.price*x.qty,0),note:note.value,status:"รับออเดอร์แล้ว",time:new Date().toLocaleString("th-TH")});saveOrders(o);cart=[];note.value="";renderCart();renderHistory();alert("สั่งสำเร็จ")}
function card(o,staff=false){return `<div class="order"><b>โต๊ะ ${o.table}</b> · <span class="muted">${o.time}</span><br>${o.items.map(x=>x.name+" × "+x.qty).join(", ")}<br><b>รวม ฿${o.total}</b><br><span class="status">${o.status}</span>${o.note?"<br><span class='muted'>"+o.note+"</span>":""}${staff?`<br><button class="btn" style="margin-top:8px" onclick="nextStatus(${o.id})">อัปเดตสถานะ</button>`:""}</div>`}
function renderHistory(){history.innerHTML=orders().filter(o=>o.table===table).map(o=>card(o)).join("")||"<div class='muted'>ยังไม่มีออเดอร์</div>"}
function toggleStaff(){customer.classList.toggle("hidden");staff.classList.toggle("hidden");renderStaff()}function renderStaff(){allOrders.innerHTML=orders().map(o=>card(o,true)).join("")||"<div class='muted'>ยังไม่มีออเดอร์</div>"}
function nextStatus(id){let st=["รับออเดอร์แล้ว","กำลังเตรียม","พร้อมเสิร์ฟ","เสิร์ฟแล้ว"],o=orders(),x=o.find(a=>a.id===id);if(x)x.status=st[Math.min(st.length-1,st.indexOf(x.status)+1)];saveOrders(o);renderStaff();renderHistory()}
function makeQR(){let tableValue=String(qrTable.value||"").trim();if(!tableValue||Number(tableValue)<1){alert("กรุณาใส่หมายเลขโต๊ะ");return}let url=location.origin+location.pathname+"?table="+encodeURIComponent(tableValue);QRCode.toCanvas(document.getElementById("qr"),url,{width:260,margin:2,errorCorrectionLevel:"H"},function(err){if(err){console.error(err);alert("สร้าง QR ไม่สำเร็จ");return}qrUrl.textContent="โต๊ะ "+tableValue+" • "+url;downloadQrBtn.style.display="block"})}
function downloadQR(){const canvas=document.getElementById("qr");if(!canvas.width)return alert("กรุณาสร้าง QR ก่อน");const a=document.createElement("a");a.download="hangout-table-"+qrTable.value+".png";a.href=canvas.toDataURL("image/png");a.click()}
renderTabs();renderMenu();renderCart();renderHistory();
</script></body></html>
